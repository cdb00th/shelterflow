name: ShelterFlow Prod Build

on:
  workflow_dispatch:
  push:
    branches: [feat/s3-external-materialization]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      id-token: write      
      contents: read
    env:
      SHELTERFLOW_BUCKET: ${{ vars.SHELTERFLOW_BUCKET }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Python setup
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: dbt deps
        working-directory: dbt_shelterflow
        run: dbt deps

      - name: Load bronze from S3
        run: python pipelines/bronze_ingest.py --source s3  

      - name: dbt build
        working-directory: dbt_shelterflow
        run: dbt build --target prod  